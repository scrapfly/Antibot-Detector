<!-- History Tab Template -->
  <div class="history-header">
    <div class="history-toolbar">
      <div class="search-container">
        <input type="text" id="historySearch" class="search-input" placeholder="Search history..." data-i18n-placeholder="searchHistory">
      </div>
      <button id="historyMenuBtn" class="history-square-btn history-menu-btn" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" data-i18n-title="historyMoreActions" data-i18n-aria-label="historyMoreActions">
        <svg width="14" height="4" viewBox="0 0 14 4" aria-hidden="true">
          <circle cx="2.4" cy="2" r="1.3" fill="currentColor"/>
          <circle cx="7" cy="2" r="1.3" fill="currentColor"/>
          <circle cx="11.6" cy="2" r="1.3" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <input type="file" id="importHistoryFile" accept=".json" style="display: none;">
  </div>

  <!-- Toolbar "…" menu: whole-history actions (import / export / clear) -->
  <div id="historyMenu" class="history-menu" role="menu" hidden>
    <button id="importHistoryBtn" class="history-menu-item" role="menuitem" title="Import history" data-i18n-title="historyImportTitle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
      </svg>
      <span data-i18n="historyImportTitle">Import history</span>
    </button>
    <button id="exportHistoryBtn" class="history-menu-item" role="menuitem" title="Export history" data-i18n-title="historyExportTitle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
      </svg>
      <span data-i18n="historyExportTitle">Export history</span>
    </button>
    <div class="history-menu-separator" role="separator"></div>
    <button id="clearHistoryBtn" class="history-menu-item history-menu-item-danger" role="menuitem" title="Clear history" data-i18n-title="historyClearTitle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      <span data-i18n="historyClearTitle">Clear history</span>
    </button>
  </div>

  <!-- Per-entry "…" menu: shared by every card, filled for the entry it was opened from -->
  <div id="historyItemMenu" class="history-menu" role="menu" hidden>
    <button class="history-menu-item" role="menuitem" data-action="copy">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
      </svg>
      <span data-i18n="historyCopyEntryTitle">Copy data</span>
    </button>
    <div class="history-menu-separator" role="separator"></div>
    <button class="history-menu-item" role="menuitem" data-action="clear-cache">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
      </svg>
      <span data-i18n="buttonClearCache">Clear Cache</span>
    </button>
    <button class="history-menu-item" role="menuitem" data-action="export">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
      </svg>
      <span data-i18n="btnExport">Export</span>
    </button>
    <button class="history-menu-item" role="menuitem" data-action="blacklist">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
      </svg>
      <span data-i18n="addBlacklistBtn">Add to Blacklist</span>
    </button>
    <div class="history-menu-separator" role="separator"></div>
    <button class="history-menu-item history-menu-item-danger" role="menuitem" data-action="delete">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      <span data-i18n="btnDelete">Delete</span>
    </button>
  </div>

  <div id="historyList" class="history-list"></div>

  <div id="historyPagination" class="pagination">
    <div class="pagination-info" data-i18n="paginationNoItems">No items to display</div>
    <div class="pagination-controls">
      <button class="pagination-btn pagination-btn-prev" disabled aria-label="Previous page" data-i18n-aria-label="paginationPrev">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.41 7.41L14 6L8 12L14 18L15.41 16.59L10.83 12Z" fill="currentColor"/>
        </svg>
      </button>
      <div class="page-info">
        <span data-i18n="paginationPage">Page</span>
        <input type="text" class="page-input" value="1" aria-label="Current page number" data-i18n-aria-label="paginationCurrentPageAria" />
        <span data-i18n="paginationOf">of</span>
        <span class="total-pages">1</span>
      </div>
      <button class="pagination-btn pagination-btn-next" disabled aria-label="Next page" data-i18n-aria-label="paginationNext">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 6L8.59 7.41L13.17 12L8.59 16.59L10 18L16 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="historyEmpty" class="empty-state" style="display: none;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" opacity="0.5" aria-hidden="true">
      <path d="M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3Z" stroke="currentColor" stroke-width="2" fill="none"/>
    </svg>
    <h3 data-i18n="historyEmptyTitle">No history yet</h3>
    <p data-i18n="historyEmptyDescription">Detection history will appear here as you browse websites.</p>
  </div>

  <!-- History Detail Modal -->
  <div id="historyDetailModal" class="history-modal" style="display: none;">
    <div class="history-modal-overlay"></div>
    <div class="history-modal-container">
      <div class="history-modal-header">
        <div class="history-modal-title-section">
          <span class="history-modal-favicon-tile">
            <img id="historyModalFavicon" class="history-modal-favicon" src="" alt="">
          </span>
          <div class="history-modal-title-info">
            <h3 id="historyModalTitle">Page Title</h3>
            <div class="history-modal-subline">
              <a id="historyModalUrl" class="history-modal-url" href="#" target="_blank" rel="noopener noreferrer">URL</a>
              <span class="history-subline-dot" aria-hidden="true">•</span>
              <span id="historyModalTimestamp" class="history-modal-timestamp"></span>
            </div>
          </div>
        </div>
        <div class="history-modal-header-actions">
          <button type="button" id="historyModalCopy" class="history-item-action-btn" title="Copy data" aria-label="Copy data" data-i18n-title="historyCopyEntryTitle" data-i18n-aria-label="historyCopyEntryTitle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
          <button type="button" id="historyModalClose" class="btn-close" title="Close" aria-label="Close" data-i18n-title="btnClose" data-i18n-aria-label="btnClose"><svg class="btn-close-icon" viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true" focusable="false"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></button>
        </div>
      </div>
      <div id="historyModalStats" class="history-modal-summary"></div>
      <div id="historyModalContent" class="history-modal-content">
        <!-- Detection details will be populated here -->
      </div>
    </div>
  </div>
